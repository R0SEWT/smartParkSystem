name: Deploy API to Azure Web App

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-appservice.yml"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  WEBAPP_NAME: "smartparksystemapi"
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke tests
        run: |
          SMARTPARK_TESTING=1 python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Prepare artifact
        run: |
          mkdir -p ../build
          zip -r ../build/api.zip . -x "**/__pycache__/*" ".venv/*" "*.pyc"

      - name: Azure login (OIDC)
        if: ${{ secrets.AZURE_CLIENT_ID != '' && vars.AZURE_RESOURCE_GROUP != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to staging slot (OIDC)
        if: ${{ secrets.AZURE_CLIENT_ID != '' && vars.AZURE_RESOURCE_GROUP != '' }}
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az webapp deployment source config-zip \
              -g "$AZURE_RESOURCE_GROUP" \
              -n "$WEBAPP_NAME" \
              --slot staging \
              --src "$GITHUB_WORKSPACE/build/api.zip"

      - name: Smoke check (staging slot)
        if: ${{ secrets.AZURE_CLIENT_ID != '' && vars.AZURE_RESOURCE_GROUP != '' }}
        run: |
          set -euo pipefail
          BASE="https://${WEBAPP_NAME}-staging.azurewebsites.net"
          for i in {1..30}; do
            if curl -fsS "$BASE/healthz" > /dev/null; then
              break
            fi
            echo "Waiting for staging slot to be ready ($i/30)..."
            sleep 5
          done
          curl -fsS "$BASE/openapi.json" > /dev/null

      - name: Swap staging -> production (OIDC)
        if: ${{ secrets.AZURE_CLIENT_ID != '' && vars.AZURE_RESOURCE_GROUP != '' }}
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az webapp deployment slot swap \
              -g "$AZURE_RESOURCE_GROUP" \
              -n "$WEBAPP_NAME" \
              --slot staging \
              --target-slot production

      - name: Smoke check (production)
        if: ${{ secrets.AZURE_CLIENT_ID != '' && vars.AZURE_RESOURCE_GROUP != '' }}
        run: |
          set -euo pipefail
          BASE="https://${WEBAPP_NAME}.azurewebsites.net"
          curl -fsS "$BASE/healthz" > /dev/null

      - name: Deploy to Azure Web App (publish profile)
        if: ${{ !(secrets.AZURE_CLIENT_ID != '' && vars.AZURE_RESOURCE_GROUP != '' ) }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          package: build/api.zip
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
